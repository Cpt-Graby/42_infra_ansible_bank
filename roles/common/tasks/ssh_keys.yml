---
# An empty list would write an empty authorized_keys and lock everyone out.
- name: Check that SSH keys are defined
  ansible.builtin.assert:
    that: common_ssh_keys | length > 0
    fail_msg: common_ssh_keys is empty, set it in inventory/group_vars/all.yml

- name: Ensure .ssh directory exists
  ansible.builtin.file:
    path: /home/ansible/.ssh
    state: directory
    owner: ansible
    group: ansible
    mode: "0700"

- name: Deploy authorized_keys
  ansible.builtin.template:
    src: authorized_keys.j2
    dest: /home/ansible/.ssh/authorized_keys
    owner: ansible
    group: ansible
    mode: "0600"
