---
# tasks file for sshd
# sshd_config includes sshd_config.d/*.conf before its own settings and keeps the
# first value read for each option: this drop-in wins over the distribution's
# defaults and over 50-cloud-init.conf.
- name: Deploy sshd hardening drop-in
  ansible.builtin.template:
    src: 20-ssh-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/20-ssh-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd
