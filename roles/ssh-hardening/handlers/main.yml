---
# handlers file for ssh-hardening
# The full configuration (sshd_config + every drop-in) is checked before the reload:
# if it is invalid the play stops and the running sshd keeps its previous configuration.
- name: Validate full sshd configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  listen: Reload sshd

- name: Reload sshd service
  ansible.builtin.service:
    name: "{{ ssh_hardening_service }}"
    state: reloaded
  listen: Reload sshd
