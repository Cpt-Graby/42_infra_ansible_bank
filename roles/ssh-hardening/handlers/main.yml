---
# handlers file for ssh-hardening
# Notify "Restart ssh": the full configuration (sshd_config + every drop-in)
# is checked first. If the check fails the play stops and the running sshd,
# still on its previous configuration, keeps accepting connections.
- name: Validate full sshd configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  listen: Restart ssh

- name: Restart ssh service
  ansible.builtin.service:
    name: ssh
    state: restarted
  listen: Restart ssh
