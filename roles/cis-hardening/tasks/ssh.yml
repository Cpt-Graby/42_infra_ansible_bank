---
# tasks file for CIS SSH settings
- name: Restrict /etc/ssh/sshd_config permissions
  ansible.builtin.file:
    path: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"

# Read before 20-ssh-hardening.conf: on a conflict, the CIS value wins.
- name: Deploy CIS sshd drop-in
  ansible.builtin.template:
    src: 10-cis-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-cis-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd
