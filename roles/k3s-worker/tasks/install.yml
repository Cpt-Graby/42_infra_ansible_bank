---
- name: Download k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: "{{ k3s_install_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Run k3s install script (agent)
  ansible.builtin.command:
    cmd: "{{ k3s_install_script }}"
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: agent
    K3S_URL: "https://{{ k3s_api_endpoint }}:6443"
    K3S_TOKEN: "{{ k3s_node_token }}"
    K3S_NODE_NAME: "{{ ansible_nodename }}"
  no_log: true

- name: Enable and start k3s-agent
  ansible.builtin.service:
    name: k3s-agent
    enabled: true
    state: started

- name: Wait for the worker node to be Ready
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl wait --for=condition=Ready node/{{ ansible_nodename }} --timeout=10s
  register: k3s_node_ready
  until: k3s_node_ready.rc == 0
  retries: 30
  delay: 10
  changed_when: false
  delegate_to: "{{ groups['k3s_control'][0] }}"
