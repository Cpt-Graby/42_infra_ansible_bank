---
# tasks file for the automation account
# An empty list with exclusive: true would remove every key, Ansible included.
- name: Check that automation keys are defined
  ansible.builtin.assert:
    that: users_automation_keys | length > 0
    fail_msg: users_automation_keys is empty, set it in inventory/group_vars/all.yml

- name: Keep only automation keys on the automation account
  ansible.posix.authorized_key:
    user: "{{ users_automation_user }}"
    key: "{{ users_automation_keys | join('\n') }}"
    exclusive: true
