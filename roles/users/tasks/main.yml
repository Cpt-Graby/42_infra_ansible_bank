---
# tasks file for users

- name: Load OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['distribution'] }}.yml"
    - "{{ ansible_facts['os_family'] }}.yml"

- name: Configure admin accounts
  ansible.builtin.import_tasks: admins.yml

- name: Restrict automation account keys
  ansible.builtin.import_tasks: automation.yml

- name: Remove legacy accounts
  ansible.builtin.import_tasks: removed.yml
