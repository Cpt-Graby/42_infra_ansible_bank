---
# defaults file for k3s-control
# Site values live in inventory/group_vars/k3s/vars.yml (token: k3s/vault.yml).

# Pinned release, passed to the install script as INSTALL_K3S_VERSION.
k3s_version: ""

# Address added to the API server certificate (--tls-san): the one workers and
# kubectl use to reach port 6443.
k3s_api_endpoint: "{{ ansible_host }}"

# Shared secret used by the workers to join the cluster.
k3s_token: ""

k3s_install_script: /usr/local/bin/k3s-install.sh
