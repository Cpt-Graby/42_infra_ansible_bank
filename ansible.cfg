[defaults]
inventory           = ./inventory/
log_path            = ./ansible.log
roles_path          = ./roles
gathering           = implicit
timeout             = 10
forks               = 5
interpreter_python  = auto_silent

remote_user         = ansible
private_key_file    = ../key/ansible
vault_passowrd_file = ../key/vault_pass
host_key_checking   = False

[privilege_escalation]
become              = True
become_method       = sudo
become_user         = root
become_ask_pass     = False

[ssh_connection]
ssh_args            = -o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes
pipelining          = True
