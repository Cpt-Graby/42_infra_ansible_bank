---
- name: Apply common configuration, admin accounts and SSH hardening to VMs
  hosts: vms:!lxc
  roles:
    - role: common
      tags: common
    - role: users
      tags: users
    - role: ssh-hardening
      tags: ssh-hardening
    - role: cis-hardening
      tags: cis-hardening

- name: Import k3s control plane playbook
  ansible.builtin.import_playbook: k3s-control.yml
